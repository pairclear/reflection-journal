<head>
<meta charset="utf-8">

<title>Дневник рефлексии для пары · Relationship reflection journal</title>
<meta name="description" content="Вопросы для дневника после ссоры, перед трудным разговором, при ревности и после расставания. Работает в браузере, ничего не отправляет. Free relationship journal prompts for after a fight or before a hard conversation, private and offline.">

<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1714'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c0613f'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf7f2; --card:#f2ede5; --field:#ffffff; --ink:#1a1714; --muted:#6b645c; --line:#e4ddd2;
  --accent:#b85c3c; --accent-soft:#f3e2d9; --btn:#1a1714; --btn-ink:#faf7f2; --focus:#b85c3c;
  --serif:"Iowan Old Style","Charter","Georgia","Cambria","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --card:#211e19; --field:#1b1814; --ink:#efe9df; --muted:#a39b8f; --line:#332e27;
    --accent:#d9774f; --accent-soft:#3a271e; --btn:#efe9df; --btn-ink:#15130f;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --card:#211e19; --field:#1b1814; --ink:#efe9df; --muted:#a39b8f; --line:#332e27;
  --accent:#d9774f; --accent-soft:#3a271e; --btn:#efe9df; --btn-ink:#15130f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;text-decoration:none;min-width:0}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--ink)}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.langs{display:flex;gap:4px;flex:none}
.langs button{font:inherit;font-size:14px;background:none;border:1px solid transparent;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--card)}
main{padding:40px 0 56px;min-height:60vh}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0}
h1{font-size:clamp(34px,6vw,54px)}
h2{font-size:clamp(26px,4vw,34px)}
h3{font-size:20px}
.lead{font-size:19px;max-width:640px;margin:18px 0 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.sits{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
@media (max-width:820px){.sits{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.sits{grid-template-columns:1fr}}
.sit{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:border-color .15s, transform .15s}
.sit:hover{border-color:var(--accent);transform:translateY(-1px)}
.sit:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sit h3{font-size:21px}
.sit p{margin:0;font-size:15px;color:var(--muted)}
.sit .meta{margin-top:auto;padding-top:6px;font-size:13px;color:var(--accent);font-weight:600}
label.lbl{display:block;font-weight:600;margin:24px 0 8px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:14px 16px;outline:none;transition:border-color .15s, box-shadow .15s;min-height:180px;resize:vertical}
textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.btn{font:inherit;font-weight:600;font-size:16px;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);padding:12px 20px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.link{background:none;border:none;padding:12px 4px;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.langs button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.note{border-left:3px solid var(--accent);background:var(--card);padding:14px 18px;border-radius:0 10px 10px 0;font-size:15px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 10px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sitline{font-size:14px;color:var(--muted);margin:0 0 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qtext{font-family:var(--serif);font-size:clamp(24px,3.6vw,32px);line-height:1.25;font-weight:600;max-width:760px;margin:0}
.follow{color:var(--muted);margin:12px 0 0;max-width:700px}
.follow::before{content:"↳ ";color:var(--accent)}
.kbd{font-size:13px;color:var(--muted);margin-left:auto}
@media (hover:none),(max-width:600px){.kbd{display:none}}
.qa{margin-top:28px}
.qa .item{padding:18px 0;border-top:1px solid var(--line)}
.qa .item h4{margin:0 0 6px;font-size:16px;font-weight:600}
.qa .item p{margin:0;white-space:pre-wrap}
.qa .item.close{background:var(--accent-soft);border:none;border-radius:var(--r);padding:16px 18px;margin-top:10px}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:start;margin-top:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr;gap:24px}}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.entries{margin-top:44px}
.entries ul{list-style:none;margin:14px 0 0;padding:0}
.entries li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.entries li button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.entries li button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.entries .d{font-size:14px;color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);padding:36px 0 48px;font-size:15px;color:var(--muted)}
footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:820px){footer .cols{grid-template-columns:1fr}}
footer h3{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);margin-bottom:8px}
footer p{margin:0 0 10px}
footer .crisis{border:1px solid var(--accent);border-radius:var(--r);padding:16px}
details{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}
summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{max-width:720px}
@media print{
  header.top,.actions,.langs,footer .cols>div:nth-child(3),footer details,.btn,.entries{display:none!important}
  body{background:#fff;color:#000}
  .qa .item.close{background:#f4f4f4}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#" id="home"><span class="mark" aria-hidden="true"><i></i></span><span data-i="brand"></span></a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main><div class="wrap" id="app" aria-live="polite"></div></main>

<footer>
  <div class="wrap">
    <div class="cols">
      <div>
        <h3 data-i="f_what_h"></h3>
        <p data-i="f_what"></p>
      </div>
      <div>
        <div class="crisis">
          <h3 data-i="f_crisis_h"></h3>
          <p data-i="f_crisis" data-html></p>
        </div>
      </div>
      <div>
        <h3 data-i="f_priv_h"></h3>
        <p data-i="f_priv"></p>
        <p><a id="pclink" href="https://pairclear.com/?utm_source=github&amp;utm_medium=tool&amp;utm_campaign=reflection-journal" target="_blank" rel="noopener" data-i="f_pc"></a></p>
        <p><a href="https://github.com/pairclear/reflection-journal" target="_blank" rel="noopener" data-i="f_src"></a></p>
      </div>
    </div>
    <details>
      <summary data-i="m_h"></summary>
      <p data-i="m1"></p>

    </details>
  </div>
</footer>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";

/* Questions live in data/prompts.json. `node scripts/build.mjs` copies them here. */
const DATA = /*DATA*/{"version":1,"situations":[{"id":"after-a-fight","title":{"en":"After a fight","ru":"После ссоры"},"use_when":{"en":"A fight happened in the last hours or days, and it keeps going round in your head.","ru":"Ссора была в последние часы или дни, и она всё ещё крутится в голове."},"before":{"en":"If you are still boiling, take a break first: at least 20 minutes of something else (a walk, a shower, music). Writing goes better once your body has calmed down.","ru":"Если ты ещё кипишь, сначала сделай паузу: хотя бы 20 минут на что-то другое (прогулка, душ, музыка). Писать легче, когда тело успокоилось."},"prompts":[{"q":{"en":"What happened, as a camera would have recorded it? Only words and actions, no interpretations.","ru":"Что произошло, как это записала бы камера? Только слова и действия, без толкований."},"f":{"en":"What was the first moment it started going wrong?","ru":"В какой момент всё начало идти не так?"}},{"q":{"en":"What did I feel during the fight, and what do I feel now?","ru":"Что я чувствовал(а) во время ссоры, и что чувствую сейчас?"},"f":{"en":"Which feeling is the hardest to admit?","ru":"Какое чувство признать труднее всего?"}},{"q":{"en":"What did I tell myself about my partner in that moment?","ru":"Что я говорил(а) себе о партнёре в тот момент?"},"f":{"en":"What else could be true? Name one other explanation.","ru":"Что ещё может быть правдой? Назови одно другое объяснение."}},{"q":{"en":"What did I need in that moment and not get?","ru":"Что мне было нужно в тот момент и чего я не получил(а)?"},"f":{"en":"Did I say it out loud, or did I expect it to be guessed?","ru":"Я сказал(а) это вслух или ждал(а), что догадаются?"}},{"q":{"en":"What was my part in how it went? Not blame, just my share.","ru":"Какая моя часть в том, как всё пошло? Не вина, а просто моя доля."},"f":{"en":"What would I do differently in that same moment?","ru":"Что бы я сделал(а) иначе в тот же момент?"}},{"q":{"en":"What might my partner have felt or needed?","ru":"Что мог(ла) чувствовать или хотеть партнёр?"},"f":{"en":"This is a guess. How could I check it instead of assuming?","ru":"Это догадка. Как её проверить, а не додумывать?"}},{"q":{"en":"What do I want now: to talk it through, to apologise, to ask for something, or to let it go?","ru":"Чего я хочу теперь: поговорить, извиниться, о чём-то попросить или отпустить?"},"f":{"en":"What first sentence could I start with?","ru":"С какой первой фразы можно начать?"}}]},{"id":"before-a-hard-talk","title":{"en":"Before a hard conversation","ru":"Перед трудным разговором"},"use_when":{"en":"You need to raise something difficult with your partner and want to go in clear-headed.","ru":"Нужно поднять с партнёром трудную тему, и хочется подойти к разговору с ясной головой."},"before":{"en":"If you are afraid of how your partner will react, put your safety first. Preparing better words does not make an unsafe conversation safe. See the box at the bottom of the page.","ru":"Если ты боишься реакции партнёра, сначала подумай о своей безопасности. Хорошо подобранные слова не делают опасный разговор безопасным. Смотри блок внизу страницы."},"prompts":[{"q":{"en":"What do I want to talk about, in one or two sentences?","ru":"О чём я хочу поговорить, в одном-двух предложениях?"},"f":{"en":"If the talk goes well, what will be different afterwards?","ru":"Если разговор пройдёт хорошо, что изменится после?"}},{"q":{"en":"What exactly do I want to ask for? A concrete action, not \"be more attentive\".","ru":"О чём именно я хочу попросить? Конкретное действие, а не «будь внимательнее»."},"f":{"en":"What would a small first version of it look like?","ru":"Как выглядел бы маленький первый шаг к этому?"}},{"q":{"en":"What am I afraid of in this conversation?","ru":"Чего я боюсь в этом разговоре?"},"f":{"en":"If that happened, what would I do?","ru":"Если это случится, что я сделаю?"}},{"q":{"en":"How might my partner see this situation?","ru":"Как может видеть эту ситуацию партнёр?"},"f":{"en":"What in their view do I agree with, even a little?","ru":"С чем в его или её взгляде я согласен(на), хотя бы немного?"}},{"q":{"en":"Write the opening line, starting from yourself: \"I feel ... when ..., and I would like ...\"","ru":"Напиши первую фразу, начиная с себя: «Я чувствую ..., когда ..., и мне хотелось бы ...»"},"f":{"en":"Read it aloud. Does it sound like a request or like a charge?","ru":"Прочитай вслух. Это звучит как просьба или как обвинение?"}},{"q":{"en":"When and where is a good moment for it?","ru":"Когда и где для этого хороший момент?"},"f":{"en":"Not in passing, not when someone is tired or hungry, not in front of others.","ru":"Не на бегу, не когда кто-то устал или голоден, не при других."}},{"q":{"en":"What will I do if the conversation starts going badly?","ru":"Что я сделаю, если разговор начнёт идти плохо?"},"f":{"en":"Which words will I use to ask for a pause, and when will we come back to it?","ru":"Какими словами я попрошу паузу, и когда мы к этому вернёмся?"}}]},{"id":"weekly-check-in","title":{"en":"Weekly couple check-in","ru":"Еженедельная сверка пары"},"use_when":{"en":"Once a week, alone or with your partner, to notice what is going on between you before it piles up.","ru":"Раз в неделю, одному или вместе с партнёром, чтобы заметить, что происходит между вами, пока это не накопилось."},"before":{"en":"If you do it together, each of you writes alone first, then you share only what you want to share. Start with the good parts.","ru":"Если делаете вместе, сначала каждый пишет сам, потом делитесь только тем, чем хочется. Начните с хорошего."},"prompts":[{"q":{"en":"What was good between us this week?","ru":"Что было хорошего между нами на этой неделе?"},"f":{"en":"What did my partner do that I appreciated, and did I tell them?","ru":"Что сделал(а) партнёр, что я оценил(а), и сказал(а) ли я об этом?"}},{"q":{"en":"When did I feel close this week? When did I feel distant?","ru":"Когда на этой неделе я чувствовал(а) близость? А когда отдаление?"},"f":{"en":"What was going on around those moments?","ru":"Что происходило вокруг этих моментов?"}},{"q":{"en":"Is there something I left unsaid?","ru":"Есть ли что-то, что я не договорил(а)?"},"f":{"en":"Is it worth bringing up, and how?","ru":"Стоит ли это поднять, и как?"}},{"q":{"en":"What do I need from us next week? One concrete request.","ru":"Что мне нужно от нас на следующей неделе? Одна конкретная просьба."},"f":{"en":"How will I ask for it?","ru":"Как я об этом попрошу?"}},{"q":{"en":"What can I give next week? One small thing.","ru":"Что я могу дать на следующей неделе? Одна небольшая вещь."},"f":{"en":"When exactly will I do it?","ru":"Когда именно я это сделаю?"}},{"q":{"en":"What are we looking forward to together?","ru":"Чего мы ждём вместе?"},"f":{"en":"If nothing comes to mind, what could we plan?","ru":"Если ничего не приходит в голову, что можно запланировать?"}}]},{"id":"jealousy","title":{"en":"When I feel jealous","ru":"Когда я ревную"},"use_when":{"en":"Jealousy has come up and you want to understand it before you act on it.","ru":"Появилась ревность, и хочется понять её до того, как что-то делать."},"before":{"en":"Jealousy is a feeling, not a fact about your partner. If jealousy in your relationship has turned into control or threats, from either side, that is a reason to talk to a specialist.","ru":"Ревность это чувство, а не факт о партнёре. Если ревность в ваших отношениях превратилась в контроль или угрозы, с любой стороны, это повод поговорить со специалистом."},"prompts":[{"q":{"en":"What happened that set off the feeling? Facts only.","ru":"Что произошло, что запустило это чувство? Только факты."},"f":{"en":"What did I see or hear myself, and what did I add in my head?","ru":"Что я видел(а) или слышал(а) сам(а), а что достроил(а) в голове?"}},{"q":{"en":"What exactly am I afraid of?","ru":"Чего именно я боюсь?"},"f":{"en":"Losing them? Being replaced? Being deceived? Mattering less?","ru":"Потерять? Что меня заменят? Обманут? Что я стану менее важен(на)?"}},{"q":{"en":"How strong is the feeling right now, from 0 to 10?","ru":"Насколько сильное чувство прямо сейчас, от 0 до 10?"},"f":{"en":"What makes it stronger, and what makes it weaker?","ru":"Что его усиливает, а что ослабляет?"}},{"q":{"en":"What did I do with it: check, ask, stay silent, accuse?","ru":"Что я с ним сделал(а): проверял(а), спросил(а), промолчал(а), обвинил(а)?"},"f":{"en":"How did that work for us?","ru":"Как это сработало для нас?"}},{"q":{"en":"What would help me feel more secure in this relationship?","ru":"Что помогло бы мне чувствовать себя спокойнее в этих отношениях?"},"f":{"en":"Is it something to ask for, something I can do myself, or both?","ru":"Это то, о чём можно попросить, что могу сделать я сам(а), или и то и другое?"}},{"q":{"en":"Do I want to say something to my partner about it?","ru":"Хочу ли я что-то сказать об этом партнёру?"},"f":{"en":"How can I say it as my feeling, not as a charge against them?","ru":"Как сказать это как своё чувство, а не как обвинение?"}}]},{"id":"feeling-distant","title":{"en":"When we feel distant","ru":"Когда мы отдалились"},"use_when":{"en":"Things are not bad, but you feel further apart than before.","ru":"Всё вроде не плохо, но вы как будто дальше друг от друга, чем раньше."},"before":{"en":"Distance is common in long relationships and usually builds slowly. The point here is to notice it, not to find who is to blame.","ru":"Отдаление часто бывает в долгих отношениях и обычно копится медленно. Здесь важно заметить его, а не найти виноватого."},"prompts":[{"q":{"en":"When did I last feel really close to my partner? What was happening then?","ru":"Когда я в последний раз чувствовал(а) настоящую близость с партнёром? Что тогда происходило?"},"f":{"en":"What made that moment possible?","ru":"Что сделало этот момент возможным?"}},{"q":{"en":"What has changed since then?","ru":"Что изменилось с тех пор?"},"f":{"en":"Between us, in the life around us, in me?","ru":" /* ---------- state ---------- */
let lang = "en";
let view = { name: "home" };
let S = { draft: null, entries: [] };

const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} },
  del(){ try { localStorage.removeItem(KEY); } catch(e){} }
};
const save = () => store.set({ lang, draft: S.draft, entries: S.entries });

function pickLang(saved){
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "ru" || q === "en") return q;
  if (saved && (saved.lang === "ru" || saved.lang === "en")) return saved.lang;
  const nav = (navigator.languages || [navigator.language || "en"]).join(",").toLowerCase();
  return /(^|,)(ru|uk|be|kk)/.test(nav) ? "ru" : "en";
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const t = () => T[lang];
const sitById = (id) => DATA.situations.find(s => s.id === id);
const qsOf = (sit) => sit.prompts.concat(DATA.closing);
const fmtDate = (ts) => new Date(ts).toLocaleString(lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const isoDate = (ts) => { const d = new Date(ts), p = (n) => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); };
const pcUrl = (medium) => (lang === "ru" ? "https://pairclear.com/ru/" : "https://pairclear.com/en/") + "?utm_source=github&utm_medium=" + medium + "&utm_campaign=" + CAMPAIGN;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(_){} ta.remove();
  }
  toast(t().copied);
}
function download(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- markdown ---------- */
function entryMD(e, withFoot = true){
  const L = t(), sit = sitById(e.sit), qs = qsOf(sit);
  let md = "# " + sit.title[lang] + "\n\n" + isoDate(e.ts) + "\n";
  qs.forEach((q, i) => {
    if (i === sit.prompts.length) md += "\n## " + L.closing + "\n";
    const a = (e.answers[i] || "").trim();
    md += "\n**" + q.q[lang] + "**\n\n" + (a || "_" + L.skipped + "_") + "\n";
  });
  return md + (withFoot ? "\n---\n" + L.md_foot + "\n" : "");
}
function entryBody(e){
  const sit = sitById(e.sit);
  return qsOf(sit).map((q, i) => ({ q: q.q[lang], a: (e.answers[i] || "").trim() }))
    .filter(x => x.a).map(x => x.q + "\n" + x.a).join("\n\n");
}

/* ---------- static text ---------- */
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => {
    const v = t()[el.dataset.i];
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#pclink").href = pcUrl("tool");
  document.title = lang === "ru" ? "Дневник рефлексии для пары: вопросы после ссоры и перед трудным разговором" : "Relationship reflection journal: prompts for after a fight or before a hard talk";
}

/* ---------- views ---------- */
function viewHome(){
  const L = t();
  const d = S.draft && sitById(S.draft.sit);
  return `
    <h1>${esc(L.h1)}</h1>
    <p class="lead">${esc(L.lead)}</p>
    ${d ? `
      <div class="note" style="margin-top:28px">
        <b>${esc(L.draft_h)}</b>: ${esc(d.title[lang])}
        <div class="row" style="margin-top:12px">
          <button class="btn" data-act="resume">${esc(L.resume)}</button>
          <button class="btn ghost" data-act="discard">${esc(L.discard)}</button>
        </div>
      </div>` : ""}
    <h2 style="margin-top:44px;font-size:24px">${esc(L.pick)}</h2>
    <div class="sits">${DATA.situations.map(s => `
      <button class="sit" data-sit="${esc(s.id)}">
        <h3>${esc(s.title[lang])}</h3>
        <p>${esc(s.use_when[lang])}</p>
        <span class="meta">${esc(L.qcount(s.prompts.length))}</span>
      </button>`).join("")}</div>
    ${S.entries.length ? `
      <section class="entries">
        <h2 style="font-size:24px">${esc(L.entries_h)}</h2>
        <ul>${S.entries.slice().sort((a, b) => b.ts - a.ts).map(e => `
          <li><button data-open="${esc(e.id)}">${esc(sitById(e.sit).title[lang])}</button><span class="d">${esc(fmtDate(e.ts))}</span></li>`).join("")}</ul>
        <div class="row">
          <button class="btn ghost" data-act="export-all">${esc(L.export_all)}</button>
          <button class="btn link" data-act="clear-all">${esc(L.clear_all)}</button>
        </div>
      </section>` : ""}`;
}

function viewIntro(sit){
  const L = t();
  return `
    <p class="muted small" style="margin:0 0 8px"><a href="#" data-act="home">← ${esc(L.back)}</a></p>
    <h1>${esc(sit.title[lang])}</h1>
    <p class="lead"><b>${esc(L.use_when)}:</b> ${esc(sit.use_when[lang])}</p>
    <p class="note" style="margin-top:24px;max-width:720px">${esc(sit.before[lang])}</p>
    <p class="muted small" style="margin-top:18px">${esc(L.qcount(sit.prompts.length))} · ${esc(L.saved_note)}</p>
    <div class="row"><button class="btn" data-act="begin">${esc(L.start)} →</button></div>`;
}

function viewQuestion(){
  const L = t(), d = S.draft, sit = sitById(d.sit), qs = qsOf(sit), i = d.i, q = qs[i];
  const last = i === qs.length - 1, inClose = i >= sit.prompts.length;
  return `
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(i / qs.length * 100)}%"></i></div>
    <p class="sitline"><span>${esc(sit.title[lang])}${inClose ? " · " + esc(L.closing) : ""}</span><span>${i + 1} ${esc(L.of)} ${qs.length}</span></p>
    <h2 class="qtext" id="qh">${esc(q.q[lang])}</h2>
    <p class="follow">${esc(q.f[lang])}</p>
    <form id="qForm" autocomplete="off">
      <label class="lbl" for="ans" style="position:absolute;left:-9999px">${esc(q.q[lang])}</label>
      <textarea id="ans" aria-labelledby="qh" placeholder="${esc(L.ph)}" style="margin-top:22px">${esc(d.answers[i] || "")}</textarea>
      <div class="row" style="margin-top:14px">
        <button class="btn" type="submit">${esc(last ? L.finish : L.next)} →</button>
        <button class="btn ghost" type="button" data-act="skip">${esc(L.skip)}</button>
        <button class="btn link" type="button" data-act="prev">← ${esc(L.back)}</button>
        <span class="kbd">${esc(L.ctrl)}</span>
      </div>
    </form>`;
}

function viewEntry(e, fresh){
  const L = t(), sit = sitById(e.sit), qs = qsOf(sit);
  const any = e.answers.some(a => (a || "").trim());
  return `
    <p class="muted small" style="margin:0 0 8px"><a href="#" data-act="home">← ${esc(L.to_list)}</a></p>
    ${fresh ? `<p class="muted" style="margin:0">${esc(L.done_h)}</p>` : ""}
    <h1>${esc(sit.title[lang])}</h1>
    <p class="muted" style="margin:6px 0 0">${esc(fmtDate(e.ts))}</p>
    <div class="grid2">
      <div class="qa">
        ${any ? qs.map((q, k) => {
          const a = (e.answers[k] || "").trim();
          if (!a) return "";
          return `<div class="item ${k >= sit.prompts.length ? "close" : ""}"><h4>${esc(q.q[lang])}</h4><p>${esc(a)}</p></div>`;
        }).join("") : `<p class="note">${esc(L.nothing)}</p>`}
      </div>
      <div style="margin-top:28px">
        <div class="card">
          <div class="actions">
            <button class="btn" data-act="copy-prompt">${esc(L.copy_prompt)}</button>
            <button class="btn ghost" data-act="copy-md">${esc(L.copy_md)}</button>
            <button class="btn ghost" data-act="dl-md">${esc(L.dl_md)}</button>
            <button class="btn ghost" data-act="print">${esc(L.print)}</button>
          </div>
          <p class="muted small" style="margin:14px 0 0">${esc(L.prompt_hint)}</p>
          <div class="actions" style="margin-top:14px">
            <button class="btn ghost" data-act="home">${esc(L.new_entry)}</button>
            <button class="btn link" data-act="del">${esc(L.del_entry)}</button>
          </div>
        </div>
        <div class="card" style="margin-top:16px;background:transparent">
          <h3>${esc(L.pc_h)}</h3>
          <p class="muted" style="margin:10px 0 16px">${esc(L.pc_p)}</p>
          <a class="btn ghost" href="${esc(pcUrl("result"))}" target="_blank" rel="noopener">${esc(L.pc_cta)} →</a>
        </div>
      </div>
    </div>`;
}

/* ---------- render & events ---------- */
function render(focus = true){
  const app = $("#app");
  if (view.name === "intro") { app.innerHTML = viewIntro(sitById(view.sit)); bindIntro(); }
  else if (view.name === "q" && S.draft) { app.innerHTML = viewQuestion(); bindQuestion(focus); }
  else if (view.name === "entry") {
    const e = S.entries.find(x => x.id === view.id);
    if (!e) { view = { name: "home" }; return render(); }
    app.innerHTML = viewEntry(e, view.fresh); bindEntry(e);
  }
  else { view = { name: "home" }; app.innerHTML = viewHome(); bindHome(); }
  app.querySelectorAll("[data-act=home]").forEach(el => el.addEventListener("click", (ev) => { ev.preventDefault(); go({ name: "home" }); }));
}
function go(v){ view = v; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
const on = (act, fn) => { const el = $("[data-act=" + act + "]"); if (el) el.addEventListener("click", fn); };

function bindHome(){
  const L = t();
  document.querySelectorAll("[data-sit]").forEach(b => b.addEventListener("click", () => go({ name: "intro", sit: b.dataset.sit })));
  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => go({ name: "entry", id: b.dataset.open })));
  on("resume", () => go({ name: "q" }));
  on("discard", () => { S.draft = null; save(); render(); });
  on("export-all", () => {
    const md = "# " + L.md_title + "\n\n" + S.entries.slice().sort((a, b) => a.ts - b.ts).map(e => entryMD(e, false).replace(/^# /, "## ").replace(/\n## /g, "\n### ")).join("\n---\n\n") + "\n---\n" + L.md_foot + "\n";
    download("reflection-journal-" + new Date().toISOString().slice(0, 10) + ".md", md);
  });
  on("clear-all", () => {
    if (!confirm(L.clear_q)) return;
    store.del(); S = { draft: null, entries: [] }; render(); toast(L.cleared);
  });
}

function bindIntro(){
  on("begin", () => {
    const sit = sitById(view.sit);
    if (!S.draft || S.draft.sit !== sit.id) S.draft = { sit: sit.id, i: 0, answers: qsOf(sit).map(() => ""), ts: Date.now() };
    save(); go({ name: "q" });
  });
}

function bindQuestion(focus){
  const d = S.draft, qs = qsOf(sitById(d.sit)), ta = $("#ans");
  const advance = () => {
    d.answers[d.i] = ta.value;
    if (d.i < qs.length - 1) { d.i++; save(); go({ name: "q" }); return; }
    const e = { id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), sit: d.sit, ts: d.ts || Date.now(), answers: d.answers.map(a => String(a || "")) };
    S.entries.push(e); S.draft = null; save();
    go({ name: "entry", id: e.id, fresh: true });
  };
  ta.addEventListener("input", () => { d.answers[d.i] = ta.value; save(); });
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); advance(); } });
  $("#qForm").addEventListener("submit", (e) => { e.preventDefault(); advance(); });
  on("skip", () => { ta.value = d.answers[d.i] = ""; advance(); });
  on("prev", () => {
    d.answers[d.i] = ta.value;
    if (d.i === 0) { save(); go({ name: "intro", sit: d.sit }); }
    else { d.i--; save(); go({ name: "q" }); }
  });
  if (focus) setTimeout(() => ta.focus({ preventScroll: true }), 50);
}

function bindEntry(e){
  const L = t(), sit = sitById(e.sit);
  on("copy-md", () => copy(entryMD(e)));
  on("dl-md", () => download("reflection-" + e.sit + "-" + isoDate(e.ts).slice(0, 10) + ".md", entryMD(e)));
  on("print", () => window.print());
  on("copy-prompt", () => copy(L.prompt(sit.title[lang], entryBody(e) || "(" + L.skipped + ")")));
  on("del", () => {
    if (!confirm(L.del_q)) return;
    S.entries = S.entries.filter(x => x.id !== e.id); save(); toast(L.deleted); go({ name: "home" });
  });
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; save(); applyStatic(); render(false);
}));
$("#home").addEventListener("click", (e) => { e.preventDefault(); go({ name: "home" }); });

/* ---------- boot ---------- */
const saved = store.get();
lang = pickLang(saved);
if (saved) {
  const okSit = (id) => !!sitById(id);
  S.entries = Array.isArray(saved.entries) ? saved.entries.filter(e => e && okSit(e.sit) && Array.isArray(e.answers)).map(e => ({ id: String(e.id), sit: e.sit, ts: +e.ts || Date.now(), answers: e.answers.map(String) })) : [];
  const d = saved.draft;
  if (d && okSit(d.sit) && Array.isArray(d.answers)) {
    const n = qsOf(sitById(d.sit)).length;
    S.draft = { sit: d.sit, ts: +d.ts || Date.now(), answers: Array.from({ length: n }, (_, k) => String(d.answers[k] || "")), i: Math.min(Math.max(0, +d.i || 0), n - 1) };
  }
}
const start = new URLSearchParams(location.search).get("s");
if (start && sitById(start)) view = { name: "intro", sit: start };
applyStatic();
render(false);
})();
</script>
</body>
</html>
